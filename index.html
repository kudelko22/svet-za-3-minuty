      this.chyba = chybaText(e); Zvuk.play('bad');
    } finally {
      if (prihlasuje) { this.pracuje = ''; if (st.faza === 'prihlasenie') obnovPrihlasenie(); }
    }
  },
  vyber(id, pohlad = 'domov') {
    this.ulozHned();
    const d = this.deti.find(x => x.id === id);
    if (!d) return;
    nastavAktivne(d); noveOdznaky(); S.set('aktivne', id); socStart(id);
    Object.assign(st, { flow: null, faza: 'appka', view: pohlad });
    render(); scrollTo(0, 0);
  },
  // uloženie z tvorby postavičky (nové dieťa alebo úprava existujúceho)
  ulozDieta(u) {
    const id = u.id || noveId(), stare = this.deti.find(x => x.id === id);
    const prazdne = { body: 0, done: [], fav: [], dni: [] };
    const zaklad = id === st.dietaId ? st : stare || (u.prve && (STARY.body || STARY.done.length) ? STARY : prazdne);
    const d = {
      meno: u.meno.slice(0, 20), vek: u.vek, avatar: { ...u.avatar },
      body: Math.max(0, Math.round(zaklad.body || 0)), done: [...(zaklad.done || [])], fav: [...(zaklad.fav || [])], dni: (zaklad.dni || []).slice(-60), odznaky: [...(zaklad.odznaky || [])], kedy: { ...(zaklad.kedy || {}) }, chyby: [...(zaklad.chyby || [])], vybrate: [...(zaklad.vybrate || [])],
      poradie: stare ? stare.poradie : Date.now(),
    };
    if (stare) Object.assign(stare, d); else this.deti.push({ id, ...d });
    zapis(id, d);
    this.vyber(id, stare ? 'ja' : 'domov');
  },
  zmazDieta(id) {
    this.deti = this.deti.filter(x => x.id !== id);
    deleteDoc(doc(db, 'rodiny', this.pouzivatel.uid, 'deti', id)).catch(e => toast('Nepodarilo sa odstrániť: ' + chybaText(e)));
    socZmaz(id);
    if (st.dietaId === id) { st.dietaId = null; S.set('aktivne', null); }
    st.faza = this.deti.length ? 'vyber' : 'tvorba';
    if (st.faza === 'tvorba') st.upravuje = noveUpravovanie(false);
    render(); toast('Profil je odstránený.');
  },
};
window.Cloud = Cloud;

// ---- Priatelia (verzia 2.0): verejný profil profily/<id dieťaťa>, kód kody/<KÓD>, žiadosti a priatelia pod profilom,
// správy rozhovory/<id1_id2>/spravy. Čo kto smie, stráži firestore.rules (len nálepky a hotové vety, len medzi priateľmi).
const Soc = { pid: null, nacitane: false, zapnute: false, profil: null, ziadosti: [], priatelia: {}, profily: {}, spravy: {} };
let socOdbery = [], socZozn = [], socPriatelia = {}, socZoznamy = false, socOtlacok = '';
const rozhovor = (a, b) => [a, b].sort().join('_');
const socObnov = () => { if (typeof socZmena === 'function') socZmena(); };
const KOD_SLOVA = ['SOVA', 'DUHA', 'VLAK', 'RYBA', 'KOLO', 'SLON', 'MRAK', 'KVET', 'LIST', 'ZAJO'], KOD_ZNAKY = 'ABCDEFGHJKMNPRSTUVXYZ23456789';
const novyKod = () => KOD_SLOVA[Math.floor(Math.random() * KOD_SLOVA.length)] + '-' + Array.from({ length: 4 }, () => KOD_ZNAKY[Math.floor(Math.random() * KOD_ZNAKY.length)]).join('');
function socZastav() {
  [...socOdbery, ...socZozn].forEach(f => f()); Object.values(socPriatelia).forEach(f => f());
  socOdbery = []; socZozn = []; socPriatelia = {}; socZoznamy = false; socOtlacok = '';
  Object.assign(Soc, { pid: null, nacitane: false, zapnute: false, profil: null, ziadosti: [], priatelia: {}, profily: {}, spravy: {} });
}
function socStart(pid) {
  if (Soc.pid === pid && socOdbery.length) return;
  socZastav();
  if (!pid || !Cloud.pouzivatel) return;
  Soc.pid = pid;
  socOdbery.push(onSnapshot(doc(db, 'profily', pid), { includeMetadataChanges: true }, sn => {
    if (Soc.pid !== pid) return;
    Soc.profil = sn.exists() ? sn.data() : null; Soc.zapnute = !!(Soc.profil && Soc.profil.zapnute); Soc.nacitane = true;
    // zoznamy až keď cloud profil naozaj má (inak ich pravidlá odmietnu)
    if (Soc.zapnute && !socZoznamy && !sn.metadata.hasPendingWrites) socZoznamyStart(pid);
    if (Soc.zapnute) socUlozProfil(); // pokrok mohol pribudnúť na inom telefóne alebo kým sa načítaval profil
    socObnov();
  }, () => { Soc.nacitane = true; socObnov(); }));
}
function socZoznamyStart(pid) {
  socZozn.forEach(f => f()); socZozn = []; socZoznamy = true;
  // pri chybe (napríklad profil sa ešte len ukladá) skúsime znova o chvíľu
  const znova = () => { if (Soc.pid !== pid || !socZoznamy) return; socZozn.forEach(f => f()); socZozn = []; socZoznamy = false; setTimeout(() => { if (Soc.pid === pid && Soc.zapnute && !socZoznamy) socZoznamyStart(pid); }, 3000); };
  socZozn.push(onSnapshot(collection(db, 'profily', pid, 'ziadosti'), sn => { Soc.ziadosti = sn.docs.map(x => ({ id: x.id, ...x.data() })); socObnov(); }, znova));
  socZozn.push(onSnapshot(collection(db, 'profily', pid, 'priatelia'), sn => {
    const ids = sn.docs.map(x => x.id);
    Soc.priatelia = Object.fromEntries(ids.map(f => [f, true]));
    ids.filter(f => !socPriatelia[f]).forEach(f => socSleduj(pid, f));
    Object.keys(socPriatelia).filter(f => !ids.includes(f)).forEach(f => { socPriatelia[f](); delete socPriatelia[f]; delete Soc.profily[f]; delete Soc.spravy[f]; });
    S.set('soc-caka-' + pid, S.get('soc-caka-' + pid, []).filter(x => !ids.includes(x.pid)));
    socObnov();
  }, znova));
}
function socSleduj(pid, f) {
  const a = onSnapshot(doc(db, 'profily', f), sn => { Soc.profily[f] = sn.exists() ? sn.data() : null; socObnov(); }, () => {});
  const b = onSnapshot(query(collection(db, 'rozhovory', rozhovor(pid, f), 'spravy'), orderBy('kedy', 'desc'), limit(40)), sn => {
    Soc.spravy[f] = sn.docs.map(x => { const m = x.data({ serverTimestamps: 'estimate' }); return { id: x.id, od: m.od, k: m.k, n: m.n, kedy: m.kedy && m.kedy.toMillis ? m.kedy.toMillis() : Date.now() }; }).reverse();
    socObnov();
  }, () => {});
  socPriatelia[f] = () => { a(); b(); };
}
// verejný profil: len meno, postavička a pokrok z hry; body za týždeň = body - tyzStart (od pondelka)
function socData(kod, zapnute = true) {
  const p = Soc.profil, tk = tyzKluc(), body = Math.max(0, Math.round(st.body || 0));
  return {
    meno: (st.meno || 'Dieťa').slice(0, 20), avatar: { ...st.avatar }, body, seria: Math.min(5000, seria()), temy: Math.min(1000, st.done.filter(byId).length),
    odznaky: Math.min(500, st.odznaky.length), posledne: st.odznaky.slice(-5), tyzKey: tk,
    tyzStart: p && p.tyzKey === tk ? Math.min(p.tyzStart, body) : p ? Math.min(p.body, body) : body,
    kod, rodina: Cloud.pouzivatel.uid, zapnute,
  };
}
function socUlozProfil() {
  if (!Soc.zapnute || !Soc.profil || Soc.pid !== st.dietaId || !Cloud.pouzivatel) return;
  const p = Soc.profil, d = socData(p.kod), o = JSON.stringify(d);
  if (o === socOtlacok) return;
  socOtlacok = o;
  const rovnake = ['meno', 'body', 'seria', 'temy', 'odznaky', 'tyzKey', 'tyzStart'].every(k => p[k] === d[k]) && JSON.stringify(p.posledne) === JSON.stringify(d.posledne) && zoradene(p.avatar) === zoradene(d.avatar);
  if (rovnake) return; // bez zmeny nič nezapisujeme
  setDoc(doc(db, 'profily', Soc.pid), { ...d, upravene: serverTimestamp() }).catch(() => { socOtlacok = ''; });
}
function socZmaz(id) {
  getDoc(doc(db, 'profily', id)).then(sn => {
    if (!sn.exists()) return;
    const b = writeBatch(db); b.delete(doc(db, 'profily', id)); if (sn.data().kod) b.delete(doc(db, 'kody', sn.data().kod));
    return b.commit();
  }).catch(() => {});
  if (Soc.pid === id) socZastav();
}
Object.assign(Soc, {
  async zapni() {
    const pid = st.dietaId;
    if (!pid || !Cloud.pouzivatel) throw 'Najprv sa prihláste.';
    for (let pokus = 0; pokus < 6; pokus++) {
      const kod = novyKod();
      if ((await getDoc(doc(db, 'kody', kod))).exists()) continue;
      const b = writeBatch(db);
      b.set(doc(db, 'profily', pid), { ...socData(kod), upravene: serverTimestamp() });
      b.set(doc(db, 'kody', kod), { pid, rodina: Cloud.pouzivatel.uid });
      try { await b.commit(); return true; } catch (e) { if ((e && e.code !== 'permission-denied') || pokus === 5) throw e; }
    }
    throw 'Kód sa nepodarilo vytvoriť, skúste znova.';
  },
  async vypni() {
    const p = Soc.profil;
    if (!p) return;
    const b = writeBatch(db);
    b.set(doc(db, 'profily', Soc.pid), { ...socData('', false), upravene: serverTimestamp() });
    if (p.kod) b.delete(doc(db, 'kody', p.kod));
    await b.commit();
  },
  async ziadost(text) {
    const c = String(text || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length !== 8) throw 'Kód má 8 znakov, napríklad SOVA-K7M2.';
    const kod = c.slice(0, 4) + '-' + c.slice(4);
    if (Soc.profil && kod === Soc.profil.kod) throw 'To je tvoj vlastný kód.';
    const k = await getDoc(doc(db, 'kody', kod));
    if (!k.exists()) throw 'Taký kód neexistuje. Skontroluj ho.';
    const ciel = k.data().pid;
    if (ciel === Soc.pid) throw 'To je tvoj vlastný kód.';
    if (Soc.priatelia[ciel]) throw 'Už ste priatelia.';
    if (Soc.ziadosti.some(z => z.id === ciel)) { await Soc.prijmi(ciel); return 'priatelia'; } // kamarát už poslal žiadosť nám
    const cp = await getDoc(doc(db, 'profily', ciel));
    try {
      await setDoc(doc(db, 'profily', ciel, 'ziadosti', Soc.pid), { meno: (st.meno || 'Dieťa').slice(0, 20), avatar: { ...st.avatar }, rodina: Cloud.pouzivatel.uid, kedy: serverTimestamp() });
    } catch (e) { if (e && e.code === 'permission-denied') throw 'Žiadosť už čaká, alebo má kamarát priateľov vypnutých.'; throw e; }
    S.set('soc-caka-' + Soc.pid, [...S.get('soc-caka-' + Soc.pid, []).filter(x => x.pid !== ciel), { pid: ciel, meno: cp.exists() ? cp.data().meno : kod }]);
    return 'ziadost';
  },
  async prijmi(f) {
    const b = writeBatch(db);
    b.set(doc(db, 'profily', Soc.pid, 'priatelia', f), { kedy: serverTimestamp() });
    b.set(doc(db, 'profily', f, 'priatelia', Soc.pid), { kedy: serverTimestamp() });
    b.delete(doc(db, 'profily', Soc.pid, 'ziadosti', f));
    await b.commit();
  },
  odmietni: f => deleteDoc(doc(db, 'profily', Soc.pid, 'ziadosti', f)),
  async odober(f) {
    const b = writeBatch(db);
    b.delete(doc(db, 'profily', Soc.pid, 'priatelia', f));
    b.delete(doc(db, 'profily', f, 'priatelia', Soc.pid));
    await b.commit();
  },
  posli(f, m) {
    if (!Soc.priatelia[f]) return Promise.reject('Už nie ste priatelia.');
    return addDoc(collection(db, 'rozhovory', rozhovor(Soc.pid, f), 'spravy'), { od: Soc.pid, ...m, kedy: serverTimestamp() });
  },
});
Cloud.soc = Soc;

function nastavAktivne(d) {
  Object.assign(st, {
    dietaId: d.id, meno: d.meno || '', vek: d.vek === 'starsi' ? 'starsi' : 'mladsi', avatar: { ...AV_ZAKLAD, ...(d.avatar || nahodnyAvatar()) },
    body: d.body || 0, done: [...(d.done || [])], fav: [...(d.fav || [])], dni: [...(d.dni || [])], odznaky: [...(d.odznaky || [])],
    kedy: { ...(d.kedy || {}) }, chyby: [...(d.chyby || [])], vybrate: [...(d.vybrate || [])],
  });
}
function zapis(id, d) {
  const z = setDoc(doc(db, 'rodiny', Cloud.pouzivatel.uid, 'deti', id), {
    meno: d.meno, vek: d.vek, avatar: d.avatar, body: d.body, done: d.done, fav: d.fav, dni: d.dni, odznaky: d.odznaky || [], kedy: d.kedy || {}, chyby: d.chyby || [], vybrate: d.vybrate || [],
    poradie: d.poradie, verzia: 5, upravene: serverTimestamp(),
  });
  if (!navigator.onLine) { Cloud.stavUlozenia = 'Uložené v telefóne, do cloudu sa pošle, keď bude internet.'; obnovStav(); }
  z.then(() => { Cloud.stavUlozenia = 'Všetko je uložené v cloude ✓'; obnovStav(); },
    e => { Cloud.stavUlozenia = 'Neuložené: ' + chybaText(e); obnovStav(); });
}
function ulozAktivne() {
  casovac = null;
  const d = Cloud.deti.find(x => x.id === st.dietaId);
  if (!d || !Cloud.pouzivatel) return;
  Object.assign(d, { meno: st.meno, vek: st.vek, avatar: st.avatar, body: Math.max(0, Math.round(st.body || 0)), done: st.done.slice(0, 500), fav: st.fav.slice(0, 500), dni: st.dni.slice(-60), odznaky: st.odznaky.slice(0, 100), kedy: st.kedy, chyby: st.chyby.slice(-60), vybrate: st.vybrate.slice(0, 100) });
  zapis(d.id, d);
  socUlozProfil();
}
function obnovStav() { const el = document.getElementById('cloud-stav'); if (el) el.textContent = Cloud.stavUlozenia; }
function obnovPrihlasenie() {
  const em = (document.getElementById('email') || {}).value, he = (document.getElementById('heslo') || {}).value;
  render(); main.classList.remove('anim');
  if (em) document.getElementById('email').value = em;
  if (he) document.getElementById('heslo').value = he;
}
// zmena aktívneho dieťaťa z iného telefónu
function prevezmi(a) {
  if (casovac || otlacok(a) === otlacok(st)) return; // vlastné neuložené zmeny majú prednosť
  nastavAktivne(a);
  if (st.flow) paintHead(); else { render(); main.classList.remove('anim'); }
}
function zobrazPoNacitani() {
  const a = Cloud.deti.find(x => x.id === S.get('aktivne', null));
  if (a) { nastavAktivne(a); noveOdznaky(); socStart(a.id); Object.assign(st, { faza: 'appka', view: 'domov' }); }
  else if (Cloud.deti.length) st.faza = 'vyber';
  else { st.faza = 'tvorba'; st.upravuje = noveUpravovanie(true); }
  render();
}
// pokrok z verzie 5 (dokument pokrok/<uid>) sa prenesie ako prvé dieťa
async function prevodStareho(u) {
  try {
    const s = await getDoc(doc(db, 'pokrok', u.uid));
    if (s.exists() && !Cloud.deti.length) {
      const c = s.data(), id = noveId();
      const d = { meno: (c.meno || 'Dieťa').slice(0, 20), vek: c.vek === 'starsi' ? 'starsi' : 'mladsi', avatar: nahodnyAvatar(),
        body: c.body || 0, done: c.done || [], fav: c.fav || [], dni: (c.dni || []).slice(-60), odznaky: [], poradie: Date.now() };
      Cloud.deti = [{ id, ...d }]; zapis(id, d); S.set('aktivne', id);
    }
  } catch (e) { /* bez starého pokroku pokračujeme ďalej */ }
  zobrazPoNacitani();
}

onAuthStateChanged(auth, u => {
  Cloud.pouzivatel = u; Cloud.deti = []; Cloud.nacitane = false; Cloud.chyba = ''; socZastav();
  if (odber) { odber(); odber = null; }
  clearTimeout(casovac); casovac = null;
  if (!u) {
    // po návrate z Googlu sa prihlásenie ešte dokončuje: neukazujeme prihlasovaciu obrazovku, aby sa neťukalo znova
    Object.assign(st, { dietaId: null, avatar: null, flow: null, faza: dokoncujeGoogle ? 'nacitava' : 'prihlasenie', sprava: dokoncujeGoogle ? 'Dokončuje sa prihlásenie cez Google…' : '' });
    render(); return;
  }
  Object.assign(st, { faza: 'nacitava', sprava: 'Prihlásené, načítavajú sa deti…' }); render();
  odber = onSnapshot(collection(db, 'rodiny', u.uid, 'deti'), { includeMetadataChanges: true }, snap => {
    const deti = snap.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => (a.poradie || 0) - (b.poradie || 0));
    if (!Cloud.nacitane) {
      if (snap.empty && snap.metadata.fromCache) return; // prvé spustenie: počkáme na odpoveď z cloudu
      Cloud.nacitane = true; Cloud.deti = deti;
      if (deti.length) zobrazPoNacitani(); else prevodStareho(u);
      return;
    }
    Cloud.deti = deti;
    const a = deti.find(x => x.id === st.dietaId);
    if (st.faza === 'appka' && st.dietaId && !a && !snap.metadata.hasPendingWrites) {
      // dieťa odstránené na inom telefóne
      Object.assign(st, { dietaId: null, flow: null, faza: deti.length ? 'vyber' : 'tvorba' });
      if (!deti.length) st.upravuje = noveUpravovanie(false);
      render(); return;
    }
    if (a && st.faza === 'appka' && !snap.metadata.hasPendingWrites && !snap.metadata.fromCache) prevezmi(a);
    if (st.faza === 'vyber') render();
  }, e => { Cloud.stavUlozenia = 'Cloud sa nedá načítať: ' + chybaText(e); obnovStav(); });
});
getRedirectResult(auth).catch(e => { Cloud.chyba = chybaText(e); }).finally(() => {
  const bolo = dokoncujeGoogle;
  dokoncujeGoogle = false; S.set('presmerovanie', 0);
  if (!Cloud.pouzivatel && (bolo || Cloud.chyba)) { Object.assign(st, { faza: 'prihlasenie', sprava: '' }); render(); }
});
</script>
<script>
// Offline: appka sa pri prvom otvorení uloží do telefónu.
// Keď príde nová verzia, stránka sa raz sama obnoví, aby ju bolo hneď vidieť.

  const mal = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (mal) location.reload(); });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
