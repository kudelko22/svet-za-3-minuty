/* veľká oslava po téme dňa */
.oslava { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; overflow: hidden; padding: 16px; background: radial-gradient(circle at 50% 38%, var(--p-FFF7D1,#FFF7D1), var(--p-BFE7FF,#BFE7FF) 70%); animation: osIn .35s ease-out both; }
.oslava.pryc { animation: osOut .3s ease-in both; }
.os-lucy { position: absolute; left: 50%; top: 34%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax; background: repeating-conic-gradient(rgb(255 255 255 / .45) 0 9deg, transparent 9deg 22deg); animation: spin 26s linear infinite; pointer-events: none; }
.os-obsah { position: relative; display: grid; justify-items: center; gap: 8px; width: min(100%, 420px); text-align: center; }
.os-strom { width: min(100%, 340px); height: auto; overflow: visible; }
.os-kmen { transform-box: fill-box; transform-origin: 50% 100%; animation: osRast .6s cubic-bezier(.3, 1.4, .5, 1) .15s both; }
.os-k { transform-box: fill-box; transform-origin: center; animation: osPop .55s cubic-bezier(.3, 1.6, .5, 1) var(--d) both; }
.os-plod { transform-box: fill-box; transform-origin: center; animation: osPlod .5s cubic-bezier(.3, 1.8, .5, 1) var(--d) both; }
.os-sova { transform-box: fill-box; transform-origin: center; animation: osPrilet 1s cubic-bezier(.25, 1.2, .5, 1) var(--d) both; }
.os-sova .owl { overflow: visible; }
.os-nadpis { margin: 0; font: 700 clamp(1.7rem, 7vw, 2.3rem)/1.1 var(--f-display); color: var(--ink); }
.os-nadpis span { display: inline-block; animation: osPismeno .5s cubic-bezier(.3, 1.8, .5, 1) calc(.9s + var(--k) * .04s) both; }
.os-seria { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px 6px 8px; border: 3px solid var(--line); border-radius: 999px; background: var(--p-FFE7C2,#FFE7C2); box-shadow: 0 4px 0 var(--shc); font: 700 1.1rem/1 var(--f-display); animation: osPop .5s cubic-bezier(.3, 1.6, .5, 1) 1.2s both; }
.os-ohen { width: 46px; height: 46px; margin: -10px 0; }
.os-seria b { font-size: 1.9rem; }
.os-seria b { display: inline-block; }
.os-seria b.bump { animation: osCislo .55s cubic-bezier(.3, 1.8, .5, 1), jelly .7s; }
.os-seria b.os-roll.bump { animation: none; }
.os-seria.hrdina { flex-direction: column; gap: 0; padding: 4px 34px 12px; border-radius: 38px; }
.os-seria.hrdina .os-ohen { width: 112px; height: 112px; margin: 0 0 -8px; }
.os-seria.hrdina b { font-size: 4.2rem; line-height: 1; }
@media (max-height: 700px) { .os-seria.hrdina .os-ohen { width: 88px; height: 88px; } .os-seria.hrdina b { font-size: 3.4rem; } }
.os-seria.zap { margin: 8px 0; animation: osZiara 1s ease-out, osVelka 1.2s cubic-bezier(.3, 1.6, .5, 1); }
.os-seria.zap .os-ohen { animation: osOhen 1.2s ease-out; }
.os-roll { position: relative; display: inline-grid !important; overflow: hidden; height: 1.15em; line-height: 1.15; }
.os-roll > span { grid-area: 1 / 1; text-align: center; }
.os-roll .nova { transform: translateY(120%); }
.os-roll.roll .stara { animation: osStara .45s ease-in forwards; }
.os-roll.roll .nova { animation: osNova .75s cubic-bezier(.2, 1.9, .4, 1) .2s forwards; }
.os-blesk { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(circle at 50% 55%, rgba(255, 226, 122, .85), rgba(255, 179, 71, .35) 40%, transparent 70%); animation: osBlesk .9s ease-out forwards; }
.os-obsah.tras { animation: osTras .5s ease-out; }
@keyframes osVelka { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }

<script>
const VERZIA_APPKY = 66; const VERZIA_NAZOV = '4.8.2'; // číslo pre telefón a novinky; názov ukazuje profil // zvýšiť pri každom nahratí, aby bolo v profile vidno, či telefón má novú verziu
const DNI = ['Po', 'Ut', 'St', 'Št', 'Pi', 'So', 'Ne'];
const DUHA = ['#FF5A5F', '#FF8A3D', '#2FBF71', '#4C7DFF', '#B36BFF', '#16BFAE', '#FF6FA8'];
const PASTEL = ['#FFE1E1', '#FFE7C7', '#FFF3B0', '#D9F8E6', '#D6E6FF', '#EBDDFF', '#FFD9EA'];
const EMBG = ['#FFF0B3', '#D6E6FF', '#FFD9EA'];
// emoji v odpovediach ako kreslené obrázky OpenMoji (e/<kód>.svg); bez signálu sa ukáže obyčajné emoji
const EMO_ODP = /(\p{RI}\p{RI}|[0-9#*]\uFE0F?\u20E3|\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}\uFE0F?|[\u{1F3FB}-\u{1F3FF}])*)/u;
const emoSubor = e => 'e/' + [...e].map(c => c.codePointAt(0).toString(16)).filter(x => x !== 'fe0f').join('-') + '.svg';
const emo = text => String(text).split(EMO_ODP).map((g, i) => i % 2 ? `<img class="emo" src="${emoSubor(g)}" alt="${g}" draggable="false" onerror="this.replaceWith(this.alt)">` : esc(g)).join('');
const TBG = ['#D6E6FF', '#D9F8E6', '#FFE3C7'];
const POCHVALA = ['Výborne!', 'Super!', 'Presne tak!', 'Paráda!', 'Si šikovný!', 'Bomba!'];
const tiche = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Pokrok dieťaťa ukladá Cloud (modul Firebase dole) do jeho profilu; v telefóne ostávajú len nastavenia
const SYNC = ['meno', 'vek', 'body', 'done', 'fav', 'dni', 'odznaky', 'kedy', 'chyby', 'vybrate'];
/* Pozadie appky: výber v profile, pamätá sa zvlášť pre každé dieťa na tomto zariadení */
const POZADIA = [
  { id: 'nebo', n: 'Nebo', fon: '#E3F4FF', b: ['rgb(255 111 168 / .45)', 'rgb(255 210 63 / .55)', 'rgb(47 191 113 / .4)', 'rgb(124 108 255 / .4)'] },
  { id: 'ruzova', n: 'Ružová', fon: '#FFE6F0', b: ['rgb(255 111 168 / .5)', 'rgb(255 180 120 / .5)', 'rgb(255 210 63 / .4)', 'rgb(190 120 255 / .4)'] },
  { id: 'luka', n: 'Lúka', fon: '#E4F8E8', b: ['rgb(47 191 113 / .45)', 'rgb(255 226 90 / .5)', 'rgb(90 200 230 / .4)', 'rgb(160 220 90 / .45)'] },
  { id: 'slnko', n: 'Slnko', fon: '#FFF4D6', b: ['rgb(255 190 60 / .55)', 'rgb(255 140 90 / .45)', 'rgb(255 111 168 / .35)', 'rgb(255 226 90 / .55)'] },
  { id: 'fialova', n: 'Fialová', fon: '#EEE8FF', b: ['rgb(124 108 255 / .5)', 'rgb(255 111 168 / .4)', 'rgb(90 160 255 / .4)', 'rgb(190 120 255 / .45)'] },
  { id: 'more', n: 'More', fon: '#DFF6F7', b: ['rgb(60 190 210 / .5)', 'rgb(90 140 255 / .4)', 'rgb(47 191 113 / .35)', 'rgb(120 220 240 / .5)'] },
];
const FARBY = [
  { id: 'mata', n: 'Mäta', c: '#DDF5EA' }, { id: 'obloha', n: 'Obloha', c: '#DCEEFF' },
  { id: 'broskyna', n: 'Broskyňa', c: '#FFE3D6' }, { id: 'citron', n: 'Citrón', c: '#FFF6C9' },
  { id: 'levandula', n: 'Levanduľa', c: '#E9E1FF' }, { id: 'ruzova', n: 'Ružová', c: '#FFE2EC' },
  { id: 'mrak', n: 'Mrak', c: '#E8EAF2' }, { id: 'vecer', n: 'Večer', c: '#DCD9F6' },
];
const STYLY = [
  { id: 'anim', n: 'Animované', svg: '<circle cx="14" cy="16" r="9" fill="#FF6FA8" opacity=".7"/><circle cx="30" cy="30" r="10" fill="#FFD23F" opacity=".8"/><path d="M8 40q6-6 12 0M30 8q4 4 8 0" fill="none" stroke="#2B2240" stroke-width="3" stroke-linecap="round"/>' },
  { id: 'farba', n: 'Jednofarebné', svg: '<rect x="8" y="8" width="28" height="28" rx="8" fill="#DCEEFF" stroke="#2B2240" stroke-width="3"/>' },
  { id: 'vzor', n: 'Jemný vzor', svg: '<path d="M9 14l4-4 4 4M30 10v8M26 14h8M12 32a3 3 0 106 0 3 3 0 10-6 0M28 34q4-6 8 0" fill="none" stroke="#2B2240" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>' },
];
const Pozadie = {
  kluc: () => 'pozadie-' + (st.dietaId || ''),
  styl() { const s = S.get('pozadie-styl-' + (st.dietaId || ''), tiche ? 'vzor' : 'anim'); return STYLY.some(x => x.id === s) ? s : 'anim'; },
  farba() { const id = S.get('pozadie-farba-' + (st.dietaId || ''), 'obloha'); return FARBY.find(f => f.id === id) || FARBY[1]; },
  dnes() { const id = S.get(this.kluc(), 'nebo'); return POZADIA.find(p => p.id === id) || POZADIA[0]; },
  pouzi() {
    const p = this.dnes(), r = document.documentElement && document.documentElement.style;
    if (!r || !r.setProperty) return;
    const styl = this.styl(), noc = Rezim.tmavy();
    document.documentElement.dataset.fonStyl = noc && styl === 'farba' ? 'anim' : styl;
    if (noc) { ['--fon', '--b1', '--b2', '--b3', '--b4'].forEach(k => r.removeProperty(k)); return; } // v noci kreslí pozadie mesačný režim
    r.setProperty('--fon', styl === 'farba' ? this.farba().c : p.fon); p.b.forEach((c, i) => r.setProperty('--b' + (i + 1), c));
  },
  zvol(id) { if (!POZADIA.some(p => p.id === id)) return; S.set(this.kluc(), id); this.pouzi(); },
  zvolStyl(id) { if (!STYLY.some(x => x.id === id)) return; S.set('pozadie-styl-' + (st.dietaId || ''), id); this.pouzi(); },
  zvolFarbu(id) { if (!FARBY.some(f => f.id === id)) return; S.set('pozadie-farba-' + (st.dietaId || ''), id); this.pouzi(); },
  rad() {
    if (this.styl() === 'farba') { const a = this.farba().id; return FARBY.map(f => `<button class="poz-vol" data-pozfarba="${f.id}" aria-pressed="${f.id === a}" style="--p0:${f.c};--p1:transparent;--p2:transparent"><i></i>${f.n}</button>`).join(''); }
    const a = this.dnes().id;
    return POZADIA.map(p => `<button class="poz-vol" data-pozadie="${p.id}" aria-pressed="${p.id === a}" style="--p0:${p.fon};--p1:${p.b[0]};--p2:${p.b[1]}"><i></i>${p.n}</button>`).join('');
  },
  karta() {
    const s = this.styl();
    return `<section class="card poz-karta"><span class="lbl">Pozadie appky</span>
      <div class="poz-styly">${STYLY.map(x => `<button class="poz-vol poz-styl" data-pozstyl="${x.id}" aria-pressed="${x.id === s}"><i><svg viewBox="0 0 44 44" aria-hidden="true">${x.svg}</svg></i>${x.n}</button>`).join('')}</div>
      <div class="poz-rad">${this.rad()}</div></section>`;
  },
};
const S = {
  get(k, d) { try { const v = localStorage.getItem('svet3:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) {
    if (SYNC.includes(k)) { if (window.Cloud && !window.Cloud.ticho) window.Cloud.naplanuj(); return; }
    try { localStorage.setItem('svet3:' + k, JSON.stringify(v)); } catch (e) {}
  },
};
/* Mesačný režim: voľba je v zariadení (nie v profile dieťaťa); 'svetly' | 'mesacny' | 'auto' (podľa systému). Neplatná hodnota = svetlý. */
const Rezim = {
  MOZNE: ['svetly', 'mesacny', 'auto'],
  vyber() { const v = S.get('rezim', 'svetly'); return Rezim.MOZNE.includes(v) ? v : 'svetly'; },
  tmavy(v = Rezim.vyber()) { return v === 'mesacny' || (v === 'auto' && !!(typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches)); },
  pouzi() {
    const noc = Rezim.tmavy(), d = typeof document !== 'undefined' && document.documentElement;
    if (!d || !d.dataset) return noc;
    if (noc) d.dataset.rezim = 'mesacny'; else delete d.dataset.rezim;
    try {
      const m = document.querySelector('meta[name="theme-color"]'); if (m && m.setAttribute) m.setAttribute('content', noc ? '#14113A' : '#E3F4FF');
      const b = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]'); if (b && b.setAttribute) b.setAttribute('content', noc ? 'black-translucent' : 'default');
    } catch (e) {}
    return noc;
  },
  zvol(v) { if (!Rezim.MOZNE.includes(v)) v = 'svetly'; S.set('rezim', v); Rezim.pouzi(); Pozadie.pouzi(); return v; },
  ikona: v => v === 'mesacny'
    ? '<svg viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" fill="#1E1A4A"/><path d="M27 7C16 8 9 17 9 26c0 9 7 16 17 16 5 0 9-2 12-5-12 2-21-6-21-17 0-6 3-11 10-13z" fill="#FFE27A" stroke="#FFF3B0" stroke-width="2.5" stroke-linejoin="round"/><circle cx="34" cy="10" r="2" fill="#FFF3B0"/><circle cx="38" cy="22" r="1.5" fill="#BFE3FF"/></svg>'

      <button class="btn ghost wide" data-auto="stop">Domov</button></div>`;
    ocisluj(); return;
  }
  main.innerHTML = `<div class="auto">${hore}
    <div class="frame auto-scena">${svg(t)}</div>

function renderFlow(anim = true) {
  const f = st.flow, k = f.kroky[f.i], n = f.kroky.length - 1, t = f.id && byId(f.id);
  const fav = t && st.fav.includes(t.id), odp = f.odp[f.i];
  document.body.style.setProperty('--kc', t ? KAT[t.k].c : '#FF9F1C');
  document.body.classList.add('tinted');
  let dalej = '';
  if (k.t !== 'koniec') {
    const caka = k.t === 'q' && !odp;
    dalej = `<div class="flow-pad"></div><div class="fnext"><div class="gut"><button class="btn ${k.t === 'q' ? '' : 'blue'} wide${caka ? '' : ' cta'}" data-dalej${caka ? ' disabled' : ''}>${caka ? 'Vyberte odpoveď' : 'Pokračovať →'}</button></div></div>`;
  }
  main.classList.toggle('anim', anim);
  const html = `<div class="ftop"><button class="ib" data-zavriet aria-label="Zavrieť">${IKO.zavriet}</button>
      <div class="fbar"><i style="width:${Math.max(6, Math.round(f.i / n * 100))}%"></i></div>
      <span class="fnum">${Math.min(f.i + 1, n)}/${n}</span>
      ${t ? `<button class="ib heart" data-fav aria-pressed="${fav}" aria-label="Uložiť tému">${fav ? IK.srdce : IK.srdcePrazdne}</button>` : ''}</div>
    ${krok(f, k)}${dalej}`;
  // vyhodnotenie odpovede (anim = false): zmení sa len to, čo sa líši, aby obrázok ani otázka neblikli
  const hore = main.firstElementChild;
  if (!anim && hore && typeof document.createElement === 'function') { const t = document.createElement('div'); t.innerHTML = html; morph(main, t, true); }
  else if (anim && hore && hore.classList.contains('ftop') && typeof document.createElement === 'function') {
    // ďalší krok v tom istom toku: horná lišta ostane (pruh pokroku sa plynulo posunie), mení sa len obsah pod ňou
    const t = document.createElement('div'); t.innerHTML = html;
    morph(hore, t.firstElementChild);
    while (hore.nextSibling) hore.nextSibling.remove();
    [...t.children].slice(1).forEach(n => main.appendChild(n));
    main.classList.add('flow-dalej');
  } else { main.classList.remove('flow-dalej'); main.innerHTML = html; }
  ocisluj();
  if (k.t === 'koniec' && anim && !f.prehra && !f.zle && !f.precvic) oslava(f);
}

function oslava(f) {
  const box = main.querySelector('.stars3'); if (!box) return;
  Zvuk.play('win'); vibruj([60, 40, 60]);
  const n = +box.dataset.n;
  box.querySelectorAll('svg').forEach((s, i) => setTimeout(() => {
    if (i >= n || !s.isConnected) return;
    Zvuk.play('star'); const [x, y] = stred(s); FX.burst(x, y, 18, ['star', 'dot'], 7);
  }, 550 + i * 300));
  if (n) setTimeout(() => FX.rain(n * 60), 250);
  if (n === 3) setTimeout(() => FX.ohnostroj(5), 1500);
  main.querySelectorAll('.odmena-karta').forEach((k, i) => setTimeout(() => {
    if (!k.isConnected) return;
    Zvuk.play('star'); vibruj(30); const [x, y] = stred(k); FX.burst(x, y, 24, ['star', 'dot', 'rect'], 7);
  }, 1900 + i * 250));
  const el = main.querySelector('.earn b');
  if (el && f.zisk) setTimeout(() => {
    let v = 0; const krok = Math.max(1, Math.ceil(f.zisk / 20));
    const iv = setInterval(() => { v = Math.min(f.zisk, v + krok); el.textContent = '+' + v; Zvuk.play('tick'); if (v >= f.zisk || !el.isConnected) { clearInterval(iv); Zvuk.play('coin'); } }, 45);

const Novinky = {
  // verzia sa zapíše až keď sa okno naozaj ukáže, takže ho dieťa nestratí, ak appku zavrie skôr
  skontroluj() {
    if (this.bolo || this.caka || st.faza !== 'appka' || !st.dietaId || st.flow || st.hra || st.auto || Sprievodca.el) return;
    const videl = S.get('videl-verziu', 0);
    if (videl >= VERZIA_APPKY) { this.bolo = true; return; }
    const odkedy = videl || (st.done.length || st.body ? 21 : VERZIA_APPKY);
    const z = NOVINKY.filter(n => n.v > odkedy);
    if (!z.length) { S.set('videl-verziu', VERZIA_APPKY); this.bolo = true; return; }
    this.caka = true;
    // okno sa ukáže až keď úplne zmizne úvodná obrazovka so sovičkou (najneskôr po 6 s ju zavrie samo)
    const t0 = Date.now();
    const skus = () => {
      const u = document.getElementById('uvod');
      if (u && u.isConnected && Date.now() - t0 < 6000) { if (Date.now() - t0 > 4500) Uvod.skry(); setTimeout(skus, 120); return; }
      setTimeout(() => {
        this.caka = false;
        if (this.bolo || document.querySelector('.novinky')) return;
        try { this.ukaz(z); this.bolo = true; S.set('videl-verziu', VERZIA_APPKY); } catch (e) { console.error('Čo je nové:', e); }
      }, 350);
    };
    setTimeout(skus, 300);
  },
  ukaz(z) {
    const el = document.createElement('div');
    el.className = 'novinky'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Čo je nové');
    el.innerHTML = `<div class="nov-karta"><div class="nov-hlava">${owl('cheer')}<div><small>Verzia ${VERZIA_NAZOV}</small><h2>Čo je nové?</h2></div></div>
      <div class="nov-zoznam">${z.map((n, i) => `<div class="nov-polozka" style="--i:${i}"><span class="nov-obr${n.siroky ? ' siroky' : ''}">${n.obr()}</span><div><b>${n.n}</b><small>${n.p}</small></div></div>`).join('')}</div>
      ${z.some(n => n.v >= 55) ? '<button class="btn wide ghost" data-novinky-tour style="margin-bottom:8px">Ukáž mi novinky</button>' : ''}
      <button class="btn wide cta" data-novinky-ok>Super, poďme na to!</button></div>`;
    document.body.appendChild(el);
    Zvuk.play('cink'); setTimeout(() => FX.burst(innerWidth / 2, innerHeight * .25, 24, ['star', 'dot']), 300);
    const b = el.querySelector('[data-novinky-ok]');
    if (b) b.addEventListener('click', e => { e.stopPropagation(); Zvuk.play('tap'); el.classList.add('pryc'); setTimeout(() => el.remove(), 300); });
    const t = el.querySelector('[data-novinky-tour]');
    if (t) t.addEventListener('click', e => { e.stopPropagation(); Zvuk.play('tap'); el.classList.add('pryc'); setTimeout(() => el.remove(), 300); setTimeout(() => Sprievodca.start(SPR_NOVE, { zavriet: 'Celého sprievodcu nájdeš v karte Ja.' }), 450); });
  },
};
// Okno „Vytvor si účet rodiča“ (3.5.1): pre účty bez rodiča, raz za spustenie appky, nikdy počas hry či kvízu; „Neskôr“ ho odloží na 3 dni
const RodicVyzva = {
  bolo: false, caka: false,
  volno() { return st.faza === 'appka' && st.dietaId && !st.flow && !st.hra && !st.auto && !Sprievodca.el && !Novinky.caka && !document.querySelector('.novinky, .oslava'); },
  skontroluj() {
    const C = window.Cloud;
    if (this.bolo || this.caka || !C || !C.rodic || !C.rodic.nacitane || C.rodic.profil || S.get('rodic-neskor-' + (C.pouzivatel ? C.pouzivatel.uid : ''), 0) > Date.now()) return;
    this.caka = true;
    const skus = n => setTimeout(() => {
      const C2 = window.Cloud;
      if (this.bolo || !C2 || !C2.rodic || C2.rodic.profil) { this.caka = false; return; }
      if (this.volno()) { this.caka = false; this.ukaz(); } else if (n < 40) skus(n + 1); else this.caka = false;
    }, 1500);
    skus(0);
  },
  ukaz() {
    this.bolo = true;
    const el = document.createElement('div');
    el.className = 'novinky rodic-okno'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Vytvor si účet rodiča');
    el.innerHTML = `<div class="nov-karta"><div class="nov-hlava">${owl('hi')}<div><small>Pre rodiča</small><h2>Vytvor si účet rodiča</h2></div></div>
      <p class="muted" style="margin:6px 4px 14px">Za vlastným PIN-om (4 číslice) nájdete prehľad všetkých detí a nastavenia. Deti ostanú pri učení a nič sa im nezmení.</p>
      <button class="btn wide cta" data-rv="ano">Vytvoriť účet rodiča</button>
      <button class="btn ghost wide" data-rv="neskor" style="margin-top:8px">Neskôr</button></div>`;
    document.body.appendChild(el);
    Zvuk.play('pop');
    const zavri = () => { el.classList.add('pryc'); setTimeout(() => el.remove(), 300); };
    el.addEventListener('click', e => {
      e.stopPropagation();
      const b = e.target.closest('[data-rv]'); if (!b) return;
      Zvuk.play('tap'); zavri();
      if (b.dataset.rv === 'ano') Rodic.chod('rodicTvorba'); else S.set('rodic-neskor-' + ((window.Cloud.pouzivatel || {}).uid || ''), Date.now() + 3 * 864e5);
    });
  },
};

  const a = onSnapshot(doc(db, 'profily', f), sn => { Soc.profily[f] = sn.exists() ? sn.data() : null; socObnov(); }, () => {});
  let prvy = true;
  const b = onSnapshot(query(collection(db, 'rozhovory', rozhovor(pid, f), 'spravy'), orderBy('kedy', 'desc'), limit(40)), sn => {
    const cas = m => m.kedy && m.kedy.toMillis ? m.kedy.toMillis() : Date.now();
    Soc.spravy[f] = sn.docs.map(x => { const m = x.data({ serverTimestamps: 'estimate' }); return { id: x.id, od: m.od, k: m.k, x: m.x, n: m.n, t: m.t, h: m.h, r: m.r, kedy: cas(m) }; }).reverse();
    // nová správa od priateľa, kým appka beží: upozornenie
    if (!prvy) sn.docChanges().filter(c => c.type === 'added' && c.doc.data().od === f).forEach(c => { if (typeof socNovaSprava === 'function') socNovaSprava(f); });
    prvy = false;
    socObnov();
  }, () => {});
  const c = onSnapshot(doc(db, 'rozhovory', rozhovor(pid, f), 'citane', f), sn => { const k = sn.exists() && sn.data({ serverTimestamps: 'estimate' }).kedy; Soc.citane[f] = k && k.toMillis ? k.toMillis() : 0; socObnov(); }, () => {});
  socPriatelia[f] = () => { a(); b(); c(); };
}
// verejný profil: len meno, postavička a pokrok z hry; body za týždeň = body - tyzStart (od pondelka)
function socData(kod, zapnute = true) {
  const p = Soc.profil, tk = tyzKluc(), body = Math.max(0, Math.round(st.body || 0));
  return {
    meno: (st.meno || 'Dieťa').slice(0, 20), avatar: { ...st.avatar }, body, seria: Math.min(5000, seria()), temy: Math.min(1000, st.done.filter(byId).length),
    odznaky: Math.min(500, st.odznaky.length), posledne: st.odznaky.slice(-5), tyzKey: tk,
    tyzStart: p && p.tyzKey === tk ? Math.min(p.tyzStart, body) : p ? Math.min(p.body, body) : body,

}
function socUlozProfil() {
  if (!Soc.zapnute || !Soc.profil || Soc.pid !== st.dietaId || !Cloud.pouzivatel) return;
  const p = Soc.profil, d = socData(p.kod), o = JSON.stringify(d);
  if (o === socOtlacok) return;
  socOtlacok = o;
  const rovnake = ['meno', 'body', 'seria', 'temy', 'odznaky', 'tyzKey', 'tyzStart', 'pisanie'].every(k => p[k] === d[k]) && JSON.stringify(p.posledne) === JSON.stringify(d.posledne) && zoradene(p.avatar) === zoradene(d.avatar);
  if (rovnake) return; // bez zmeny nič nezapisujeme
  setDoc(doc(db, 'profily', Soc.pid), { ...d, upravene: serverTimestamp() }).catch(() => { socOtlacok = ''; });
}
function socZmaz(id) {
  getDoc(doc(db, 'profily', id)).then(async sn => {
    if (!sn.exists()) return;
    // najprv zmažeme priateľstvá na oboch stranách (kým profil ešte existuje a pravidlá to dovolia)
    try {
      const pr = await getDocs(collection(db, 'profily', id, 'priatelia'));
      await Promise.allSettled(pr.docs.map(x => { const b2 = writeBatch(db); b2.delete(doc(db, 'profily', id, 'priatelia', x.id)); b2.delete(doc(db, 'profily', x.id, 'priatelia', id)); return b2.commit(); }));
    } catch (e) { /* aj bez toho profil zmažeme */ }
    const b = writeBatch(db); b.delete(doc(db, 'profily', id)); if (sn.data().kod) b.delete(doc(db, 'kody', sn.data().kod));
    return b.commit();
  }).catch(() => {});

}
Object.assign(Soc, {
  async zapni() {
    const pid = st.dietaId;
    if (!pid || !Cloud.pouzivatel) throw 'Najprv sa prihláste.';
    for (let pokus = 0; pokus < 6; pokus++) {
      const kod = novyKod();
      if ((await getDoc(doc(db, 'kody', kod))).exists()) continue;
      const b = writeBatch(db);
      b.set(doc(db, 'profily', pid), { ...socData(kod), upravene: serverTimestamp() });
      b.set(doc(db, 'kody', kod), { pid, rodina: Cloud.pouzivatel.uid });
      try { await b.commit(); return true; } catch (e) { if ((e && e.code !== 'permission-denied') || pokus === 5) throw e; }
    }
    throw 'Kód sa nepodarilo vytvoriť, skúste znova.';
  },
  // rodič zapne alebo vypne voľné písanie (v správach naň musia mať povolenie obe deti)
  async pisanie(v) {
    const p = Soc.profil;
    if (!p) return;
    await setDoc(doc(db, 'profily', Soc.pid), { ...socData(p.kod), pisanie: !!v, upravene: serverTimestamp() });
  },
  async vypni() {
    const p = Soc.profil;
    if (!p) return;
    const b = writeBatch(db);
    b.set(doc(db, 'profily', Soc.pid), { ...socData('', false), upravene: serverTimestamp() });
    if (p.kod) b.delete(doc(db, 'kody', p.kod));
    await b.commit();
  },
  async ziadost(text) {
    const c = String(text || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length !== 8) throw 'Kód má 8 znakov, napríklad SOVA-K7M2.';
    const kod = c.slice(0, 4) + '-' + c.slice(4);
    if (Soc.profil && kod === Soc.profil.kod) throw 'To je tvoj vlastný kód.';
    const k = await getDoc(doc(db, 'kody', kod));
    if (!k.exists()) throw 'Taký kód neexistuje. Skontroluj ho.';
    const ciel = k.data().pid;
    if (ciel === Soc.pid) throw 'To je tvoj vlastný kód.';
    if (Soc.priatelia[ciel]) throw 'Už ste priatelia.';
    if (Soc.ziadosti.some(z => z.id === ciel)) { await Soc.prijmi(ciel); return 'priatelia'; } // kamarát už poslal žiadosť nám
    const cp = await getDoc(doc(db, 'profily', ciel));
    try {
      await setDoc(doc(db, 'profily', ciel, 'ziadosti', Soc.pid), { meno: (st.meno || 'Dieťa').slice(0, 20), avatar: { ...st.avatar }, rodina: Cloud.pouzivatel.uid, kedy: serverTimestamp() });
    } catch (e) { if (e && e.code === 'permission-denied') throw 'Žiadosť už čaká, alebo má kamarát priateľov vypnutých.'; throw e; }
    S.set('soc-caka-' + Soc.pid, [...S.get('soc-caka-' + Soc.pid, []).filter(x => x.pid !== ciel), { pid: ciel, meno: cp.exists() ? cp.data().meno : kod }]);
    return 'ziadost';
  },
  async prijmi(f) {
    const b = writeBatch(db);
    b.set(doc(db, 'profily', Soc.pid, 'priatelia', f), { kedy: serverTimestamp() });
    b.set(doc(db, 'profily', f, 'priatelia', Soc.pid), { kedy: serverTimestamp() });
    b.delete(doc(db, 'profily', Soc.pid, 'ziadosti', f));
    await b.commit();
  },
  odmietni: f => deleteDoc(doc(db, 'profily', Soc.pid, 'ziadosti', f)),
  async odober(f) {
    const b = writeBatch(db);
    b.delete(doc(db, 'profily', Soc.pid, 'priatelia', f));
    b.delete(doc(db, 'profily', f, 'priatelia', Soc.pid));
    await b.commit();
  },
  posli(f, m) {
    if (!Soc.priatelia[f]) return Promise.reject('Už nie ste priatelia.');
    return addDoc(collection(db, 'rozhovory', rozhovor(Soc.pid, f), 'spravy'), { od: Soc.pid, ...m, kedy: serverTimestamp() });
  },
  // pochvala témou všetkým priateľom naraz
  pochval(t, h) { return Promise.allSettled(Object.keys(Soc.priatelia).map(f => Soc.posli(f, { t, h }))).then(v => { if (v.length && !v.some(x => x.status === 'fulfilled')) throw 'Správa sa nikomu nedostala.'; return v; }); },
  // srdiečko na správu priateľa (druhé ťuknutie ho zruší)
  reaguj(f, id) {
    const m = (Soc.spravy[f] || []).find(x => x.id === id);
    if (!m || m.od === Soc.pid) return Promise.resolve();
    m.r = m.r ? undefined : 'srdce';
    return updateDoc(doc(db, 'rozhovory', rozhovor(Soc.pid, f), 'spravy', id), { r: m.r ? 'srdce' : deleteField() });
  },
  // „Videné“: zapíšeme, len keď pribudla nová správa od priateľa
  precitaj(f) {
    const m = (Soc.spravy[f] || []).filter(x => x.od === f).slice(-1)[0];
    if (!m || (socCitanie[Soc.pid + ':' + f] || 0) >= m.kedy) return;
    socCitanie[Soc.pid + ':' + f] = m.kedy;
    setDoc(doc(db, 'rozhovory', rozhovor(Soc.pid, f), 'citane', Soc.pid), { kedy: serverTimestamp() }).catch(() => { socCitanie[Soc.pid + ':' + f] = 0; });
  },
});
Cloud.soc = Soc;
// pre panel rodiča: dieťa sa stane aktívnym (kvôli verejnému profilu) a spustia sa jeho priatelia a správy; zavri ich zastaví
Cloud.rodicDietaOtvor = id => { const d = Cloud.dieta(id); if (!d) return false; if (st.dietaId !== id) { Cloud.ulozHned(); nastavAktivne(d); } socStart(id); return true; };
Cloud.rodicDietaZavri = () => socZastav();

    dietaId: d.id, meno: d.meno || '', vek: d.vek === 'starsi' ? 'starsi' : 'mladsi', avatar: { ...AV_ZAKLAD, ...(d.avatar || nahodnyAvatar()) },
    body: d.body || 0, done: [...(d.done || [])], fav: [...(d.fav || [])], dni: [...(d.dni || [])], odznaky: [...(d.odznaky || [])],
    kedy: { ...(d.kedy || {}) }, chyby: [...(d.chyby || [])], vybrate: [...(d.vybrate || [])],
  });

function zapis(id, d) {
  const z = setDoc(doc(db, 'rodiny', Cloud.pouzivatel.uid, 'deti', id), {
    meno: d.meno, vek: d.vek, avatar: d.avatar, body: d.body, done: d.done, fav: d.fav, dni: d.dni, odznaky: d.odznaky || [], kedy: d.kedy || {}, chyby: d.chyby || [], vybrate: d.vybrate || [],
    poradie: d.poradie, verzia: 5, upravene: serverTimestamp(),
  });
  if (!navigator.onLine) { Cloud.stavUlozenia = 'Uložené v telefóne, do cloudu sa pošle, keď bude internet.'; obnovStav(); }
  z.then(() => { Cloud.stavUlozenia = 'Všetko je uložené v cloude ✓'; obnovStav(); },
    e => { Cloud.stavUlozenia = 'Neuložené: ' + chybaText(e); obnovStav(); });
}
// Anonymné štatistiky pre vlastníka (admin.html): len počty a id tém, bez mena a obsahu; pravidlá `statistiky/{uid}`
let statOtlacok = '';
function zapisStat() {
  try {
    if (!Cloud.pouzivatel || !Cloud.deti.length) return;
    const dnes = key(new Date()), D = /^d{4}-dd-dd$/;
    const dni = [...new Set(Cloud.deti.flatMap(x => x.dni || []).concat(dnes))].filter(x => D.test(x)).sort();
    const hry = [...new Set([...(S.get('statHry', []) || []), ...HRY_VID().filter(h => S.get(rekordKluc(h.id), null) != null).map(h => h.id)])].slice(0, 60);
    S.set('statHry', hry);
    const ang = Math.max(S.get('statAng', 0) || 0, Object.keys(Ang.data().dni || {}).length); S.set('statAng', ang);
    const pri = Math.max(S.get('statPri', 0) || 0, Object.keys(Soc.priatelia || {}).length); S.set('statPri', pri);
    const d = {
      od: dni[0], posledne: dnes, verzia: VERZIA_APPKY, nazov: String(VERZIA_NAZOV).slice(0, 12),
      mladsi: Cloud.deti.filter(x => x.vek !== 'starsi').length, starsi: Cloud.deti.filter(x => x.vek === 'starsi').length,
      temy: Cloud.deti.reduce((a, x) => a + (x.done || []).length, 0),
      done: [...new Set(Cloud.deti.flatMap(x => x.done || []))].slice(0, 500), fav: [...new Set(Cloud.deti.flatMap(x => x.fav || []))].slice(0, 500),
      hry, ang, priatelia: pri, dni: dni.slice(-60), email: String(Cloud.pouzivatel.email || '').slice(0, 120),
    };
    const o = JSON.stringify(d); if (o === statOtlacok) return; statOtlacok = o;
    setDoc(doc(db, 'statistiky', Cloud.pouzivatel.uid), { ...d, upravene: serverTimestamp() }).catch(() => { statOtlacok = ''; });
  } catch (e) { /* štatistiky nikdy nesmú rozbiť ukladanie */ }
}
function ulozAktivne() {
  casovac = null;
  const d = Cloud.deti.find(x => x.id === st.dietaId);
  if (!d || !Cloud.pouzivatel) return;
  Object.assign(d, { meno: st.meno, vek: st.vek, avatar: st.avatar, body: Math.max(0, Math.round(st.body || 0)), done: st.done.slice(0, 500), fav: st.fav.slice(0, 500), dni: st.dni.slice(-400), odznaky: st.odznaky.slice(0, 100), kedy: st.kedy, chyby: st.chyby.slice(-60), vybrate: st.vybrate.slice(0, 100) });

function obnovStav() { const el = document.getElementById('cloud-stav'); if (el) el.textContent = Cloud.stavUlozenia; }

// zmena aktívneho dieťaťa z iného telefónu
function prevezmi(a) {

  nastavAktivne(a);
  if (st.flow) paintHead(); else { render(); main.classList.remove('anim'); }
}
function zobrazPoNacitani() {

  if (a) { nastavAktivne(a); noveOdznaky(); socStart(a.id); Object.assign(st, { faza: 'appka', view: 'domov' }); }
  else if (Cloud.deti.length) st.faza = 'vyber';
  else {

// pokrok z verzie 5 (dokument pokrok/<uid>) sa prenesie ako prvé dieťa
async function prevodStareho(u) {
  const ten = () => Cloud.pouzivatel && Cloud.pouzivatel.uid === u.uid;
  try {
    // ak už toto zariadenie malo deti tohto účtu (aj zmazané), starý dokument sa znova neprenáša; nič sa nemaže
    if (!S.get('pokrok-hotovo-' + u.uid, false)) {
    const s = await getDoc(doc(db, 'pokrok', u.uid));
    if (!ten()) return;
    if (s.exists() && !Cloud.deti.length) {
      const c = s.data(), id = noveId();
      const d = { meno: (c.meno || 'Dieťa').slice(0, 20), vek: c.vek === 'starsi' ? 'starsi' : 'mladsi', avatar: nahodnyAvatar(),
        body: c.body || 0, done: c.done || [], fav: c.fav || [], dni: (c.dni || []).slice(-400), odznaky: [], poradie: Date.now() };
      Cloud.deti = [{ id, ...d }]; zapis(id, d); S.set('aktivne', id); S.set('pokrok-hotovo-' + u.uid, true);
    }
    }
  } catch (e) { /* bez starého pokroku pokračujeme ďalej */ }
  if (!ten()) return;

}

onAuthStateChanged(auth, u => {
  Cloud.pouzivatel = u; Cloud.deti = []; Cloud.nacitane = false; Cloud.chyba = ''; socZastav();
  if (odber) { odber(); odber = null; }
  if (odberRodic) { odberRodic(); odberRodic = null; }
  Cloud.rodic = { nacitane: false, profil: null, prepotvrdene: 0 }; Rodic.zamkni();
  clearTimeout(casovac); casovac = null;
  if (!u) {
    Object.assign(st, { meno: '', vek: 'mladsi', fav: [], done: [], dni: [], body: 0, odznaky: [], kedy: {}, chyby: [], vybrate: [] }); // nič z predošlého účtu v pamäti
    // po návrate z Googlu sa prihlásenie ešte dokončuje: neukazujeme prihlasovaciu obrazovku, aby sa neťukalo znova
    Object.assign(st, { dietaId: null, avatar: null, flow: null, faza: dokoncujeGoogle ? 'nacitava' : 'prihlasenie', sprava: dokoncujeGoogle ? 'Dokončuje sa prihlásenie cez Google…' : '' });
    render(); return;
  }
  Object.assign(st, { faza: 'nacitava', sprava: 'Prihlásené, načítavajú sa deti…' }); render();
  Cloud.chybaNacitania = '';
  setTimeout(() => { if (Cloud.pouzivatel === u && st.faza === 'nacitava' && !Cloud.nacitane) { st.faza = 'chybaNacitania'; render(); } }, 12000); // časový limit: ak sa nič nenačíta, ukážeme východ
  odberRodic = onSnapshot(doc(db, 'rodiny', u.uid, 'rodic', 'profil'), { includeMetadataChanges: true }, snap => {
    if (!snap.exists() && snap.metadata.fromCache) return; // prázdna kópia z pamäte nie je odpoveď servera: počkáme, aby sa existujúci PIN nedal prepísať
    const bolo = !!Cloud.rodic.profil;
    Cloud.rodic.profil = snap.exists() ? snap.data() : null; Cloud.rodic.nacitane = true;
    if (bolo && !Cloud.rodic.profil) { Rodic.zamkni(); if (st.faza.startsWith('rodic')) st.faza = 'vyber'; } // zmazaný na inom telefóne
    if (st.faza === 'vyber' || st.faza.startsWith('rodic')) renderTicho();
  }, e => { if (e && e.code === 'permission-denied') Cloud.rodic.nacitane = true; }); // pravidlá ešte nenasadené: berieme, že rodič nie je; pri inej chybe (bez siete) sa neponúka vytvorenie
  odber = onSnapshot(collection(db, 'rodiny', u.uid, 'deti'), { includeMetadataChanges: true }, snap => {
    const deti = snap.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => (a.poradie || 0) - (b.poradie || 0));
    if (!Cloud.nacitane) {
      if (snap.empty && snap.metadata.fromCache) return; // prvé spustenie: počkáme na odpoveď z cloudu
      Cloud.nacitane = true; Cloud.deti = deti;
      if (deti.length) { S.set('pokrok-hotovo-' + u.uid, true); zobrazPoNacitani(); } else prevodStareho(u);
      return;
    }
    Cloud.deti = deti;
    const a = deti.find(x => x.id === st.dietaId);
    if (st.faza === 'appka' && st.dietaId && !a && !snap.metadata.hasPendingWrites) {
      // dieťa odstránené na inom telefóne
      Object.assign(st, { dietaId: null, flow: null, faza: deti.length ? 'vyber' : 'tvorba' });
      if (!deti.length) st.upravuje = noveUpravovanie(false);
      render(); return;
    }
    if (a && st.faza === 'appka' && !snap.metadata.hasPendingWrites && !snap.metadata.fromCache) prevezmi(a);
    const podpis = JSON.stringify(deti.map(x => [x.id, x.meno, x.vek, x.body, x.poradie, x.avatar]));
    if (st.faza === 'vyber' && podpis !== Cloud.podpisVyberu) renderTicho(); // snímka bez zmeny (len metadáta) neprekresľuje
    Cloud.podpisVyberu = podpis;
  }, e => {
    Cloud.stavUlozenia = 'Cloud sa nedá načítať: ' + chybaText(e); obnovStav();
    if (!Cloud.nacitane && st.faza === 'nacitava') { Cloud.chybaNacitania = chybaText(e); st.faza = 'chybaNacitania'; render(); }
  });
});
getRedirectResult(auth).catch(e => { Cloud.chyba = chybaText(e); }).finally(() => {
  const bolo = dokoncujeGoogle;
  dokoncujeGoogle = false; S.set('presmerovanie', 0);
  if (!Cloud.pouzivatel && (bolo || Cloud.chyba)) { Object.assign(st, { faza: 'prihlasenie', sprava: '' }); render(); }
